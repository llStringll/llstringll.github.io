<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --fg:#14161a; --muted:#6b6f76;
    --line:#e4e2dc; --accent:#1f6f4a; --hover:#f0eee8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0f12; --card:#15181d; --fg:#e9eaec; --muted:#8a8f98;
      --line:#23272e; --accent:#5fd49a; --hover:#1b1f25;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:Inter,system-ui,-apple-system,sans-serif;
    min-height:100dvh; display:flex; justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  }
  main{width:100%; max-width:420px}
  header{text-align:center; margin:12px 0 28px}
  .avatar{
    width:76px;height:76px;border-radius:50%;margin:0 auto 14px;
    display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);
    font:600 26px 'JetBrains Mono',monospace;color:var(--accent);
  }
  h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .role{color:var(--muted);font-size:14px;margin-top:4px}
  .prompt{font:400 12px 'JetBrains Mono',monospace;color:var(--accent);margin-top:10px}
  .prompt::after{content:"▍";animation:b 1s steps(1) infinite;margin-left:2px}
  @keyframes b{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.prompt::after{animation:none}}

  nav{display:flex;flex-direction:column;gap:10px}
  a.l{
    display:flex;align-items:center;gap:14px;
    min-height:58px;padding:12px 16px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    color:var(--fg);text-decoration:none;
    transition:background .15s, transform .1s;
    -webkit-tap-highlight-color:transparent;
  }
  a.l:hover{background:var(--hover)}
  a.l:active{transform:scale(.985)}
  a.l svg{width:22px;height:22px;flex:none;fill:currentColor}
  .t{flex:1;min-width:0}
  .t b{display:block;font-weight:500;font-size:15px}
  .t span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arr{color:var(--muted);font-size:16px}
  a.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  a.primary .t span,a.primary .arr{color:var(--bg);opacity:.7}
  a.primary:hover{background:var(--fg);opacity:.92}
  footer{text-align:center;margin-top:28px;font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted)}
  footer a{color:var(--muted)}
</style>
